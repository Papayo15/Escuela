name: Vigilar documentos de la SEP
on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - id: revision
        run: |
          set +e
          npx tsx scripts/vigilar-fuentes.mts --actualizar
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      - if: steps.revision.outputs.codigo == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "La SEP actualizó documentos ($(date +%Y-%m))" --body-file informe-fuentes.txt
          git config user.name "vigilancia-sep"
          git config user.email "actions@users.noreply.github.com"
          git add data/fuentes/manifest.json
          git commit -m "Actualiza el manifiesto de fuentes oficiales"
          git push
      - if: steps.revision.outputs.codigo != '0' && steps.revision.outputs.codigo != '2'
        run: exit 1
